<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="1500" height="1060" fill="#ffffff"/>
<text x="750" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Helping Eyes: from your computer to a live website</text>
<rect x="250" y="75" width="1000" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="750.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">START: your computer</text>
<text x="750.0" y="125.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">the code, plus a free Gemini API key from Google AI Studio (the key is never put in the code or in git)</text>
<rect x="30" y="190" width="700" height="290" rx="14" fill="#eff6ff" stroke="#9ca3af"/>
<text x="380.0" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Option A: Render (free web service)</text>
<rect x="770" y="190" width="700" height="290" rx="14" fill="#fff7ed" stroke="#9ca3af"/>
<text x="1120.0" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Option B: Hugging Face Spaces</text>
<rect x="60" y="230" width="640" height="55" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="380.0" y="262.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Push the repository to GitHub</text>
<rect x="60" y="310" width="640" height="65" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="380.0" y="337.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">On Render: New Web Service, Docker runtime</text>
<text x="380.0" y="357.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Dockerfile Path: helping_eyes/cloud/Dockerfile (Root Directory stays empty)</text>
<rect x="60" y="400" width="640" height="60" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="380.0" y="425.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Add the secret LLM_API_KEY</text>
<text x="380.0" y="445.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">in Render&#x27;s Environment settings</text>
<rect x="800" y="230" width="640" height="55" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1120.0" y="262.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Run: HF_TOKEN=... ./helping_eyes/cloud/deploy_space.sh &lt;username&gt;</text>
<rect x="800" y="310" width="640" height="65" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1120.0" y="337.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">The script assembles a clean folder</text>
<text x="1120.0" y="357.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">requirements.txt, the 4 app files, web/, start.sh, Dockerfile, Space card</text>
<rect x="800" y="400" width="640" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1120.0" y="425.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">It pushes the folder to your Space with git</text>
<text x="1120.0" y="445.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">then add the secret LLM_API_KEY in the Space settings</text>
<path d="M600,145 L380,190" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M900,145 L1120,190" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M380,285 L380,310" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M380,375 L380,400" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1120,285 L1120,310" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1120,375 L1120,400" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="520" width="1440" height="165" rx="14" fill="#f0fdf4" stroke="#9ca3af"/>
<text x="750.0" y="548" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">The host builds the container from the Dockerfile (once, when you deploy)</text>
<rect x="55" y="575" width="250" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="180.0" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Start from Python 3.11</text>
<text x="180.0" y="630.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">a small base image</text>
<rect x="335" y="575" width="250" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="460.0" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Install system libraries</text>
<text x="460.0" y="630.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">libgl and libglib for OpenCV</text>
<path d="M305,615 L335,615" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="615" y="575" width="250" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="740.0" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">pip install requirements.txt</text>
<text x="740.0" y="630.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">the one requirements file</text>
<path d="M585,615 L615,615" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="895" y="575" width="250" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1020.0" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Download the OCR models</text>
<text x="1020.0" y="630.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">RapidOCR, so start-up is quick</text>
<path d="M865,615 L895,615" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1175" y="575" width="250" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1300.0" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Copy the app</text>
<text x="1300.0" y="630.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">the helping_eyes/ folder</text>
<path d="M1145,615 L1175,615" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M380,460 L380,520" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1120,460 L1120,520" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="250" y="725" width="1000" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="750.0" y="760.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">The container starts: bash cloud/start.sh</text>
<text x="750.0" y="780.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">runs uvicorn server:app on the host&#x27;s port ($PORT, or 7860); the OCR loads in the background so the first visit is quick</text>
<path d="M750,685 L750,725" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="30" y="845" width="1440" height="175" rx="14" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="750.0" y="873" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Live: people use it</text>
<rect x="55" y="885" width="340" height="80" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="225.0" y="920.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">A visitor&#x27;s browser</text>
<text x="225.0" y="940.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">opens the https address: page, camera, mic</text>
<rect x="515" y="885" width="360" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="695.0" y="920.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">The server</text>
<text x="695.0" y="940.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">/ws/live, /api/capture, /api/book/page, /api/ask</text>
<rect x="915" y="885" width="250" height="80" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="1040.0" y="920.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Gemini API</text>
<text x="1040.0" y="940.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">writes the answers</text>
<rect x="1195" y="885" width="250" height="80" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="1320.0" y="920.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">DuckDuckGo</text>
<text x="1320.0" y="940.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">web lookup, only if you agree</text>
<path d="M750,805 L750,845" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M395,912 L515,912" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<text x="455" y="903" text-anchor="middle" font-size="12" fill="#374151" stroke="#fff" stroke-width="4" paint-order="stroke">frames, voice</text>
<path d="M515,942 L395,942" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<text x="455" y="960" text-anchor="middle" font-size="12" fill="#374151" stroke="#fff" stroke-width="4" paint-order="stroke">hints, answers</text>
<path d="M875,925 L915,925" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1165,925 L1195,925" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<text x="750" y="1008" text-anchor="middle" font-size="13" fill="#374151">A free host goes to sleep when nobody visits; the next visit wakes it (about a minute). Sessions are kept in memory, so run one copy only.</text>
</svg>