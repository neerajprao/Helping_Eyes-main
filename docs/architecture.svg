<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="1700" height="900" fill="#ffffff"/>
<text x="850" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Helping Eyes: system architecture</text>
<rect x="30" y="70" width="480" height="640" rx="14" fill="#eff6ff" stroke="#9ca3af"/>
<text x="270.0" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Browser  (web/app.js)</text>
<rect x="570" y="70" width="550" height="640" rx="14" fill="#fff7ed" stroke="#9ca3af"/>
<text x="845.0" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Server  (server.py, FastAPI)</text>
<rect x="1180" y="70" width="490" height="640" rx="14" fill="#f0fdf4" stroke="#9ca3af"/>
<text x="1425.0" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Engines  (shared modules)</text>
<rect x="60" y="120" width="420" height="70" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="270.0" y="150.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Camera</text>
<text x="270.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">getUserMedia, rear camera</text>
<rect x="60" y="215" width="420" height="85" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="270.0" y="242.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Overlay canvas</text>
<text x="270.0" y="262.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">guide box, text lines, page layout,</text>
<text x="270.0" y="282.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">reading highlight on the line and word</text>
<rect x="60" y="325" width="420" height="70" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="270.0" y="355.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Speech in</text>
<text x="270.0" y="375.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">SpeechRecognition, hands-free, echo guard</text>
<rect x="60" y="420" width="420" height="70" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="270.0" y="450.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Speech out</text>
<text x="270.0" y="470.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">speechSynthesis, word position while reading</text>
<rect x="60" y="515" width="420" height="70" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="270.0" y="545.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Typed input and keys</text>
<text x="270.0" y="565.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">C capture, R new item, B book, A read, S stop</text>
<rect x="600" y="120" width="490" height="70" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="150.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">WS /ws/live</text>
<text x="845.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">preview frames in, guidance and page turns out</text>
<rect x="600" y="210" width="490" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="235.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">POST /api/capture</text>
<text x="845.0" y="255.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">full photo to text kept for questions</text>
<rect x="600" y="290" width="490" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="315.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">POST /api/book/page</text>
<text x="845.0" y="335.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">full photo of a book view: read it, resume, or keep</text>
<rect x="600" y="370" width="490" height="70" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="400.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">POST /api/ask</text>
<text x="845.0" y="420.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">one request: command, answer or web lookup (NDJSON)</text>
<rect x="600" y="465" width="490" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="490.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">commands.py</text>
<text x="845.0" y="510.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">classify(): stop, repeat, next, book mode, yes/no, search</text>
<rect x="600" y="545" width="490" height="95" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="577.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">live.py</text>
<text x="845.0" y="597.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">LiveGuide: hints, hold still, auto-capture, quality coaching</text>
<text x="845.0" y="617.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">BookWatcher: page turns   BookReader: new page / resume</text>
<rect x="600" y="655" width="490" height="40" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="845.0" y="680.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Session per browser: item, conversation, book state (30 min)</text>
<rect x="1210" y="120" width="430" height="70" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1425.0" y="150.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">page_enhance.py</text>
<text x="1425.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">blur/glare score, flatten, dewarp, CLAHE</text>
<rect x="1210" y="215" width="430" height="70" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1425.0" y="245.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">text_vision.py</text>
<text x="1425.0" y="265.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">OCR: Apple Vision (Mac) or RapidOCR (cloud)</text>
<rect x="1210" y="310" width="430" height="80" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1425.0" y="345.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">book_mode.py</text>
<text x="1425.0" y="365.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">spine split, page numbers, XY-cut, PageLayout</text>
<rect x="1210" y="420" width="430" height="120" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="1425.0" y="455.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">doc_assistant.py: DocAssistant</text>
<text x="1425.0" y="475.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">grounded Q&amp;A, history, NOT_IN_TEXT tag</text>
<text x="1425.0" y="495.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">expiry and page answers computed in code</text>
<text x="1425.0" y="515.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">read-all handled without the model</text>
<text x="1425" y="585" text-anchor="middle" font-size="13" fill="#374151">Qwen answers only from the captured text</text>
<rect x="1210" y="790" width="200" height="70" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="1310.0" y="820.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Ollama</text>
<text x="1310.0" y="840.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Qwen 2.5 7B / 3B</text>
<rect x="1440" y="790" width="200" height="70" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="1540.0" y="820.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">DuckDuckGo</text>
<text x="1540.0" y="840.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">search query only</text>
<rect x="60" y="790" width="300" height="70" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="210.0" y="820.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Google speech service</text>
<text x="210.0" y="840.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">used by the browser (needs internet)</text>
<rect x="600" y="780" width="490" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="845.0" y="810.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Same code, two ways to run</text>
<text x="845.0" y="830.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Mac: localhost, Apple Vision, Qwen 7B</text>
<text x="845.0" y="850.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Cloud: Hugging Face Space, RapidOCR, Qwen 3B</text>
<text x="850" y="765" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">External services and deployment</text>
